# Prometheus: WHAT to scrape, HOW often, and WHERE to send alerts.
global:
  scrape_interval: 10s          # read every target every 10 seconds
  evaluation_interval: 10s      # check the alert rules every 10 seconds

rule_files:
  - alerts.yml                  # the alert rules live next to this file

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app          # the sample app (its /metrics page)
    static_configs:
      - targets: ["demo-app:8080"]

  - job_name: node              # this machine: CPU, memory, disk, network
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus        # Prometheus watches itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Add your own server here: install node_exporter on it, then
  # - job_name: my-server
  #   static_configs:
  #     - targets: ["192.168.1.50:9100"]
