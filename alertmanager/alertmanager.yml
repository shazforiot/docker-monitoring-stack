# Alertmanager WITHOUT Discord (the default). Alerts still show up at http://localhost:9093
# To get Discord messages, put your webhook URL in .env and run the start script again:
# it switches Alertmanager to alertmanager-discord.yml.
route:
  receiver: ui-only
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ui-only
